[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabwm"
version = "0.1.0"
description = "Action-conditioned world modeling for relational systems"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "torch>=2.5",
  "numpy>=1.24",
  "einops>=0.7",
  "huggingface-hub>=0.23",
  "safetensors>=0.4",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
